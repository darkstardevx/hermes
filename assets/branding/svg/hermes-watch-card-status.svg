    <text x="430" y="435" fill="#b6c1db" font-size="25">18 projects · CI monitored · dev-log online</text>
    <text x="430" y="505" fill="#f4b64d" font-size="24">OPEN STATUS DASHBOARD  →</text>
  </g>
  <rect x="1.5" y="1.5" width="1197" height="672" rx="26.5" fill="none" stroke="#13d9ff" stroke-opacity=".45" stroke-width="3"/>
