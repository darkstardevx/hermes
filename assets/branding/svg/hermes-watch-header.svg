<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Watch</title>
  <desc id="desc">Cybercore project banner for Hermes Watch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070a12"/>
      <stop offset=".5" stop-color="#11182a"/>
      <stop offset="1" stop-color="#0b0e19"/>
    </linearGradient>
    <radialGradient id="halo" cx="72%" cy="46%" r="64%">
      <stop stop-color="#13d9ff" stop-opacity=".18"/>
      <stop offset=".48" stop-color="#8b5cf6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7b8bb5" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" rx="34" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="34" fill="url(#halo)"/>
  <rect x="20" y="20" width="1240" height="600" rx="24" fill="url(#grid)" opacity=".55"/>
  <path d="M0 515C230 430 390 570 610 470S1000 310 1280 400" fill="none" stroke="#13d9ff" stroke-opacity=".25" stroke-width="2"/>
  <path d="M0 540C230 455 390 595 610 495S1000 335 1280 425" fill="none" stroke="#8b5cf6" stroke-opacity=".26" stroke-width="2"/>
  <g transform="translate(74 86) scale(.46)"><image href="hermes-watch-mark.svg" width="1024" height="1024"/></g>
  <g fill="#f5f7ff" font-family="Inter,Segoe UI,sans-serif">
    <text x="560" y="270" font-size="72" font-weight="700" letter-spacing="8">HERMES</text>
    <text x="566" y="338" font-size="32" font-weight="500" letter-spacing="12" fill="#13d9ff">WATCH</text>
    <text x="566" y="410" font-size="22" fill="#b6c1db">Cybercore release, CI, and project intelligence</text>
  </g>
  <g fill="#13d9ff">
    <circle cx="568" cy="470" r="5"/><circle cx="596" cy="470" r="5"/><circle cx="624" cy="470" r="5"/>
  </g>
  <rect x="1.5" y="1.5" width="1277" height="637" rx="32.5" fill="none" stroke="#8b5cf6" stroke-opacity=".55" stroke-width="3"/>
</svg>
